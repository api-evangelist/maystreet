apis:
- aid: maystreet:maystreet-high-performance-query-api
  name: MayStreet High Performance Query (HPQ) API
  tags:
  - Market Data
  - WebSocket
  - Streaming
  - Tick Data
  - Near-Time
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/maystreet/workbench-hpq-springboard
  baseURL: wss://mdx.uat.maystreet.com
  properties:
  - url: https://github.com/maystreet/workbench-hpq-springboard
    type: Documentation
  description: Low-latency, near-time market data query API delivered as a streaming
    WebSockets service so clients can process arbitrarily-sized result sets frame-by-frame
    without pagination. Publicly documented only through the workbench-hpq-springboard
    example notebooks and hpq.py client on GitHub, which name the UAT endpoint
    wss://mdx.uat.maystreet.com (the production mdx.maystreet.com host resolves in
    DNS but is entitlement-gated and not publicly reachable). Access requires a
    MayStreet/LSEG Analytics Workbench entitlement.
- aid: maystreet:maystreet-data-lake-query-api
  name: MayStreet Market Data Lake Query API
  tags:
  - Market Data
  - Historical
  - Tick Data
  - SQL
  - Python
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/maystreet/workbench-data-lake-springboard
  properties:
  - url: https://github.com/maystreet/workbench-data-lake-springboard
    type: Documentation
  - url: https://github.com/maystreet/workbench-medusa-springboard
    type: Documentation
  description: Query access to MayStreet's 20+ petabyte Market Data Lake of historical
    exchange data captured as PCAP and converted to Parquet, exposed as Athena SQL
    plus a growing set of client functions through the Medusa2 Python client library
    inside Analytics Workbench. The Medusa client also reaches Refinitiv Tick History
    and Machine Readable News History stores backed by Google BigQuery. Publicly
    documented only via springboard example repositories on GitHub; no public REST
    endpoint or self-serve access is documented.
