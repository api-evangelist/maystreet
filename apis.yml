name: MayStreet
kind: company
description: MayStreet is a low-latency market data infrastructure vendor founded
  in 2012 and acquired by London Stock Exchange Group (LSEG) in May 2022, with maystreet.com
  now redirecting into LSEG's data feeds pages. The company captures full-depth exchange
  feeds in raw PCAP form across 300+ venues and sells them through the Bellport feed
  handler (C++ library, on-premises or managed), a 20+ petabyte Market Data Lake of
  historical tick data (PCAP/Parquet queried via Athena SQL and the Medusa Python
  client), the cloud Analytics Workbench (JupyterLab), and the High Performance Query
  (HPQ) streaming WebSocket API for near-time data. Access is sales-gated and entitlement-managed
  with no self-serve signup or public developer portal; the public API surface that
  exists is documented through example "springboard" repositories on the MayStreet
  GitHub organization rather than a docs site.
